<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Admin Login | ALLCARE</title>

    <link rel="stylesheet" href="style/normalize.css" />
    <link rel="stylesheet" href="style/login.css" />
    <link rel="stylesheet" href="style/notification.css" />
  </head>

  <body>
    <section class="login-page">
      <article class="login-left">
        <div class="overlay">
          <h1>ALLCARE</h1>

          <p>
            Empowering single parents through education, entrepreneurship and
            sustainable opportunities.
          </p>
        </div>
      </article>

      <article class="login-right">
        <div class="login-box">
          <h2>Login</h2> <!-- Administrator and User logins Checks all -->

          <p>
            Sign in to manage beneficiaries, donations, projects and reports.
          </p>

          <form id="loginForm">
            <input
              type="email"
              id="loginEmail"
              placeholder="Email Address"
              required
            />

            <div class="password-box">
              <input
                type="password"
                id="loginPassword"
                placeholder="Password"
                required
              />

              <button type="button" id="togglePassword">Show</button>
            </div>

            <label class="remember">
              <input type="checkbox" id="rememberMe" />

              Remember Me
            </label>

            <button type="submit" class="login-btn">Login</button>
          </form>

          <div class="login-links">
            <a href="signup.html">Create an account</a>

            <a href="index.html" class="back-home">
              ← Return to Website
            </a>
          </div>
        </div>
      </article>
    </section>
    <script src="js/notification.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/login.js"></script>
  </body>
</html>
